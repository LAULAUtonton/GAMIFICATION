<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocabulary Station</title>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f4f6fb;
  padding:20px;
}

h1{
  margin:0 0 20px 0;
  font-size:28px;
}

.controls{
  margin-bottom:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button,select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-weight:700;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

/* FLASHCARD STYLES */
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  transition:all .3s ease;
  cursor:pointer;
  min-height:280px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  perspective:1000px;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 24px rgba(0,0,0,.12);
}

.card.flipped{
  background:#f0f9ff;
}

.icon{
  margin-bottom:20px;
  font-size:48px;
  line-height:1;
}

.icon svg{
  width:48px;
  height:48px;
  stroke-width:2.25;
  stroke:currentColor;
  fill:none;
}

.icon-img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.card-content{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
}

.front-content{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.word{
  font-size:28px;
  font-weight:900;
  color:#111827;
}

.pos{
  font-size:12px;
  font-weight:900;
  color:#6b7280;
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  padding:4px 12px;
  border-radius:999px;
  width:fit-content;
  margin:0 auto;
}

.back-content{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.back{
  font-size:24px;
  color:#374151;
  font-weight:800;
}

.cat{
  font-size:12px;
  font-weight:900;
  color:#111827;
  background:#e0f2fe;
  border:1px solid #bae6fd;
  padding:4px 12px;
  border-radius:999px;
  width:fit-content;
  margin:0 auto;
}

.meta{
  font-size:12px;
  color:#9ca3af;
  margin-top:12px;
  border-top:1px solid #e5e7eb;
  padding-top:12px;
}

.flip-hint{
  font-size:11px;
  color:#d1d5db;
  margin-top:8px;
  font-style:italic;
}

</style>
</head>

<body>

<header>
<h1>Vocabulary Station — Synchronize 2</h1>

<div class="controls">
<select id="unitSelect"></select>
<button id="shuffleBtn">Shuffle</button>
</div>

</header>

<main>
<div class="grid" id="grid"></div>
</main>

<script type="module">

import { VOCAB_DB, getCards, shuffle, listUnits } from "./vocabulary.js?v=20260304";
import { getAccentColor } from "./vocab-icon-engine.js?v=20260304";

const grid = document.getElementById("grid");
const unitSelect = document.getElementById("unitSelect");
const shuffleBtn = document.getElementById("shuffleBtn");

let cards = [];

function initUnits(){
  const units = listUnits(VOCAB_DB);

  unitSelect.innerHTML =
    `<option value="all">All Units</option>` +
    units.map(u =>
      `<option value="${u.unit}">Unit ${u.unit}</option>`
    ).join("");
}

function applyIconColors(){
  document.querySelectorAll(".icon svg").forEach(svg=>{
    svg.setAttribute("stroke","currentColor");
    svg.setAttribute("fill","none");
  });
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(){

  grid.innerHTML = cards.map((card, idx) => `

  <div class="card" data-index="${idx}" onclick="toggleFlip(this)">

    <div class="icon" style="color:${getAccentColor(card.front, card.setId)}">
      ${
        card.icon.endsWith(".svg")
        ? `<img src="${card.icon}" class="icon-img" alt="${escapeHtml(card.front)}">`
        : `<i data-lucide="${escapeHtml(card.icon)}"></i>`
      }
    </div>

    <div class="card-content">
      
      <div class="front-content" style="display:flex">
        <div class="word">${escapeHtml(card.front)}</div>
        ${card.pos ? `<div class="pos">${escapeHtml(card.pos)}</div>` : ''}
      </div>

      <div class="back-content" style="display:none">
        ${card.back ? `<div class="back">${escapeHtml(card.back)}</div>` : ''}
        ${card.setLabel ? `<div class="cat">${escapeHtml(card.setLabel)}</div>` : ''}
      </div>

    </div>

    <div class="meta">
      Unit ${escapeHtml(card.unit)}
      <div class="flip-hint">Click to flip</div>
    </div>

  </div>

  `).join("");

  lucide.createIcons();
  applyIconColors();
  setupFlipHandlers();
}

function setupFlipHandlers(){
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", function() {
      toggleFlip(this);
    });
  });
}

window.toggleFlip = function(cardEl) {
  const front = cardEl.querySelector(".front-content");
  const back = cardEl.querySelector(".back-content");
  
  cardEl.classList.toggle("flipped");
  front.style.display = cardEl.classList.contains("flipped") ? "none" : "flex";
  back.style.display = cardEl.classList.contains("flipped") ? "flex" : "none";
}

function load(){
  const unitVal = unitSelect.value;

  cards = (unitVal === "all")
    ? getCards(VOCAB_DB)
    : getCards(VOCAB_DB,{unit:Number(unitVal)});

  render();
}

unitSelect.addEventListener("change",load);

shuffleBtn.addEventListener("click",()=>{
  cards = shuffle(cards);
  render();
});

initUnits();
load();

</script>

</body>
</html
